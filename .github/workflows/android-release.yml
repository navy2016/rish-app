name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rish-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Decode release keystore
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rish-release.keystore"
      - name: Build arm64 release APK
        env:
          RISH_ANDROID_KEYSTORE: ${{ runner.temp }}/rish-release.keystore
          RISH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RISH_ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RISH_ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a -PrishStandalone=true
      - name: Verify and rename APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" dist/rish-arm64-release.apk || (mkdir -p dist && cp "$APK" dist/rish-arm64-release.apk)
          ls -la dist/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rish-arm64-release
          path: apps/mobile/dist/rish-arm64-release.apk
          if-no-files-found: error
