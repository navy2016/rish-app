name: Android Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rish-android-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply fork overlay
        working-directory: .
        run: sh .github/scripts/apply-fork-overlay.sh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare zsh and pinned Rust 1.94
        working-directory: .
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zsh
          fi
          rustup toolchain install 1.94 --profile minimal
          rustup target add --toolchain 1.94 x86_64-linux-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Stage rish guest runtime (x86_64)
        working-directory: .
        env:
          RISH_ANDROID_ABIS: x86_64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          zsh scripts/prepare-rish-android.sh
      - name: Decode release keystore
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rish-release.keystore"
      - name: Build x86_64 release APK
        env:
          RISH_ANDROID_KEYSTORE: ${{ runner.temp }}/rish-release.keystore
          RISH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RISH_ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RISH_ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -PrishStandalone=true
      - name: Assert appmodules and shims packaged
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E "libappmodules\.so|librish_ffi\.so|librish_guest_jni\.so"
      - name: Build debug androidTest APK and run device acceptance
        run: |
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 -PrishStandalone=true
      - name: Run workspace acceptance on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh "$GITHUB_WORKSPACE/.github/scripts/workspace-acceptance.sh"
      - name: Boot emulator and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh "$GITHUB_WORKSPACE/.github/scripts/smoke-android.sh"
