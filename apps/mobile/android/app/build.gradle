apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
def rishStandalone = providers.gradleProperty("rishStandalone").orNull == "true"
// Official subscription CLIs are intentionally opt-in. The preparation
// script stages unmodified aarch64 binaries under arm64-v8a; no executable is
// checked into this repository and a normal build remains a lite build.
def officialCliDirProperty = providers.gradleProperty("rishOfficialCliDir").orNull
def officialCliDir = officialCliDirProperty == null ? null : file(officialCliDirProperty)
def officialCliEnabled = officialCliDir != null
def officialCliProbeEnabled = officialCliEnabled && providers.gradleProperty("rishOfficialCliProbe").orNull == "true"
if (officialCliDir != null && !officialCliDir.isDirectory()) {
    throw new GradleException("rishOfficialCliDir does not exist: ${officialCliDir}")
}
// The rish guest runtime (the pure-Rust x86_64 interpreter) is staged per ABI
// by scripts/prepare-rish-android.sh into android/rish-ffi, or wherever
// -PrishFfiDir points. Without a staged runtime the build stays a lite build:
// LocalGuest reports implemented=false and no guest boot assets ship.
def rishFfiDirProperty = providers.gradleProperty("rishFfiDir").orNull
def rishFfiDir = rishFfiDirProperty == null ? file("$rootDir/rish-ffi") : file(rishFfiDirProperty)
def rishGuestEnabled = new File(rishFfiDir, "rish_ffi.version").isFile()
if (rishFfiDirProperty != null && !rishGuestEnabled) {
    throw new GradleException("rishFfiDir has no rish_ffi.version manifest: ${rishFfiDir}; run scripts/prepare-rish-android.sh")
}
def rishStagedAbis = rishGuestEnabled
    ? (new File(rishFfiDir, "jniLibs").listFiles() ?: new File[0]).findAll { it.isDirectory() && new File(it, "librish_ffi.so").isFile() }.collect { it.name }.sort()
    : []
// The shared Rust agent core is staged by
// scripts/prepare-rish-agent-core-android.sh into android/rish-agent-core, or
// wherever -PrishAgentCoreDir points. Without it the session store refuses to
// persist rather than deciding anything locally.
def rishAgentCoreDirProperty = providers.gradleProperty("rishAgentCoreDir").orNull
def rishAgentCoreDir = rishAgentCoreDirProperty == null ? file("$rootDir/rish-agent-core") : file(rishAgentCoreDirProperty)
def rishAgentCoreEnabled = new File(rishAgentCoreDir, "rish_agent_core.version").isFile()
if (rishAgentCoreDirProperty != null && !rishAgentCoreEnabled) {
    throw new GradleException("rishAgentCoreDir has no rish_agent_core.version manifest: ${rishAgentCoreDir}; run scripts/prepare-rish-agent-core-android.sh")
}
def rishAgentCoreAbis = rishAgentCoreEnabled
    ? (new File(rishAgentCoreDir, "jniLibs").listFiles() ?: new File[0]).findAll { it.isDirectory() && new File(it, "librish_agent_ffi.so").isFile() }.collect { it.name }.sort()
    : []
def rishGuestAssetsDir = file("$rootDir/../ios/Rish/GuestAssets")
if (rishGuestEnabled && !new File(rishGuestAssetsDir, "SHA256SUMS").isFile()) {
    throw new GradleException("guest boot assets are missing: ${rishGuestAssetsDir}")
}

react {
    if (rishStandalone) debuggableVariants = []
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * Release signing material, resolved once. android/keystore.properties wins;
 * the RISH_ANDROID_KEYSTORE* environment is the CI form. Passwords are read
 * here and handed to the signing config only; nothing echoes them.
 */
def releaseSigning = {
    def propertiesFile = rootProject.file("keystore.properties")
    def storeFile = null
    def storePassword = null
    def keyAlias = null
    def keyPassword = null
    if (propertiesFile.isFile()) {
        def properties = new Properties()
        propertiesFile.withInputStream { properties.load(it) }
        storeFile = properties.getProperty("storeFile")
        storePassword = properties.getProperty("storePassword")
        keyAlias = properties.getProperty("keyAlias")
        keyPassword = properties.getProperty("keyPassword")
    } else if (System.getenv("RISH_ANDROID_KEYSTORE") != null) {
        storeFile = System.getenv("RISH_ANDROID_KEYSTORE")
        storePassword = System.getenv("RISH_ANDROID_KEYSTORE_PASSWORD")
        keyAlias = System.getenv("RISH_ANDROID_KEY_ALIAS")
        keyPassword = System.getenv("RISH_ANDROID_KEY_PASSWORD")
    }
    if (storeFile == null) return null
    def resolvedStore = rootProject.file(storeFile)
    if (!resolvedStore.isFile()) {
        throw new GradleException("release keystore does not exist: ${resolvedStore}")
    }
    if (resolvedStore.name == "debug.keystore") {
        throw new GradleException("the React Native debug keystore cannot sign a release build")
    }
    if (!storePassword || !keyAlias || !keyPassword) {
        throw new GradleException("release signing needs storePassword, keyAlias and keyPassword alongside storeFile")
    }
    return [storeFile: resolvedStore, storePassword: storePassword, keyAlias: keyAlias, keyPassword: keyPassword]
}()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "tech.zseven.rish"
    if (officialCliDir != null) {
        sourceSets {
            main {
                // AGP extracts these files to ApplicationInfo.nativeLibraryDir.
                // The preparation script names executables as .so so AGP keeps
                // them in the native-lib set; bytes are copied unchanged.
                jniLibs.srcDirs += [officialCliDir]
            }
        }
    }
    packagingOptions {
        jniLibs {
            // The CLI is an executable launched by ProcessBuilder, so it must
            // be a real file in nativeLibraryDir rather than mmap'd from APK.
            useLegacyPackaging = true
            keepDebugSymbols += ["**/libcodex.so", "**/libclaude_code.so", "**/libmusl_loader.so"]
        }
    }
    if (rishGuestEnabled || rishAgentCoreEnabled) {
        externalNativeBuild {
            cmake {
                path file("src/main/cpp/CMakeLists.txt")
                version "3.22.1"
            }
        }
        def cmakeArguments = ["-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"]
        def cmakeTargets = []
        if (rishGuestEnabled) {
            cmakeArguments += "-DRISH_FFI_DIR=${rishFfiDir.absolutePath}".toString()
            cmakeTargets += "rish_guest_jni"
        }
        if (rishAgentCoreEnabled) {
            cmakeArguments += "-DRISH_AGENT_CORE_DIR=${rishAgentCoreDir.absolutePath}".toString()
            cmakeTargets += "rish_agent_core_jni"
        }
        defaultConfig {
            externalNativeBuild {
                cmake {
                    arguments(*cmakeArguments)
                    targets(*cmakeTargets)
                }
            }
        }
    }
    if (rishAgentCoreEnabled) {
        sourceSets {
            main {
                jniLibs.srcDirs += [new File(rishAgentCoreDir, "jniLibs")]
            }
        }
    }
    if (rishGuestEnabled) {
        // A guest-enabled build ships only the ABIs the runtime was staged for.
        def requestedAbis = ((project.findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a,x86,x86_64") as String)
            .split(",").collect { it.trim() }.findAll { it }
        def missingAbis = requestedAbis - rishStagedAbis
        // Only a build that compiles the JNI shim needs every requested ABI
        // staged; unit tests and plain configuration must keep working.
        gradle.taskGraph.whenReady { graph ->
            def buildsNative = graph.allTasks.any { task ->
                task.project == project && ["configureCMake", "buildCMake", "externalNativeBuild"].any { prefix -> task.name.startsWith(prefix) }
            }
            if (buildsNative && !missingAbis.isEmpty()) {
                throw new GradleException("rish guest runtime is staged for ${rishStagedAbis} but reactNativeArchitectures requests ${requestedAbis}; pass -PreactNativeArchitectures=${rishStagedAbis.join(',')} or stage the missing ABIs with scripts/prepare-rish-android.sh")
            }
        }
        sourceSets {
            main {
                jniLibs.srcDirs += [new File(rishFfiDir, "jniLibs")]
                // The same pinned kernel and initramfs the iOS bundle carries;
                // LocalGuestModule verifies their digests before every boot.
                assets.srcDirs += [rishGuestAssetsDir]
            }
        }
    }
    testBuildType project.findProperty("rishTestBuildType") ?: "debug"
    defaultConfig {
        applicationId "tech.zseven.rish"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        buildConfigField "boolean", "RISH_STANDALONE", rishStandalone.toString()
        buildConfigField "boolean", "RISH_OFFICIAL_CLI_ENABLED", officialCliEnabled.toString()
        buildConfigField "boolean", "RISH_GUEST_RUNTIME_BUNDLED", rishGuestEnabled.toString()
        manifestPlaceholders.officialCliProbeEnabled = officialCliProbeEnabled
        versionCode 1
        versionName "1.0"
        // Phase-1 Android bring-up: instrumented smoke test runner.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release builds are signed only with a key the maintainer supplies:
        // android/keystore.properties (gitignored) or the RISH_ANDROID_KEYSTORE*
        // environment. The well-known debug key never signs a release; a
        // release build without a key fails instead of producing an APK anyone
        // could re-sign.
        release {
            if (releaseSigning != null) {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig releaseSigning != null ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    gradle.taskGraph.whenReady { graph ->
        def packagesRelease = graph.allTasks.any { task ->
            task.project == project && task.name ==~ /(package|bundle|install)Release.*/ && !task.name.contains("AndroidTest")
        }
        if (packagesRelease && releaseSigning == null) {
            throw new GradleException("release builds need a release signing key: create android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword) or set RISH_ANDROID_KEYSTORE, RISH_ANDROID_KEYSTORE_PASSWORD, RISH_ANDROID_KEY_ALIAS and RISH_ANDROID_KEY_PASSWORD; the debug key is never used for release")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Phase-1 Android bring-up test harness (AndroidX/test essentials only).
    testImplementation("junit:junit:4.13.2")
    // GuestSessionController speaks JSON to the runtime; JVM unit tests need a
    // real org.json instead of the android.jar stubs.
    testImplementation("org.json:json:20240303")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:core:1.6.1")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
}
